# Omit query strings, credentials, client IPs, cookies, and request bodies.
log_format application escape=json
    '{"time":"$time_iso8601","method":"$request_method",'
    '"path":"$uri","status":$status,"duration":$request_time}';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log application;

    # Docker's DNS service; resolve again when a backend container is replaced.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    location /api/ {
        proxy_pass $backend$request_uri;
        proxy_read_timeout 55s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Metrics are collected directly on the Docker network, never through public HTTP.
    location = /actuator/prometheus {
        return 404;
    }

    # Spring Security denies other management endpoints; only health probes are public.
    location /actuator/ {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
