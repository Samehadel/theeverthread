# Standalone stack for the dedicated monitoring EC2.
name: theeverthread-monitoring
services:
  prometheus:
    image: prom/prometheus:v3.13.5
    restart: unless-stopped
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=15d
    - --storage.tsdb.retention.size=2GB
    - --web.enable-remote-write-receiver
    volumes:
    - ./runtime/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus_data:/prometheus
    mem_limit: 512m
    logging: &id001
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
    networks:
    - telemetry
  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    ports:
    - 127.0.0.1:3000:3000
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_UNIFIED_ALERTING_ENABLED: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/app.json
    secrets:
    - grafana_password
    volumes:
    - grafana_data:/var/lib/grafana
    - ./grafana/provisioning:/etc/grafana/provisioning:ro
    - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 384m
    logging: *id001
    networks:
    - default
    - telemetry
  loki:
    image: grafana/loki:3.7.9
    restart: unless-stopped
    command:
    - -config.file=/etc/loki/config.yaml
    volumes:
    - ./loki.yaml:/etc/loki/config.yaml:ro
    - loki_data:/loki
    mem_limit: 512m
    logging: *id001
    networks:
    - telemetry
  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    restart: unless-stopped
    command:
    - --config.file=/etc/blackbox/config.yaml
    volumes:
    - ./blackbox.yaml:/etc/blackbox/config.yaml:ro
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 64m
    logging: *id001
    networks:
    - default
    - telemetry
  monitoring-node:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    pid: host
    command:
    - --path.procfs=/host/proc
    - --path.sysfs=/host/sys
    - --path.rootfs=/host/root
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($$|/)
    volumes:
    - /proc:/host/proc:ro
    - /sys:/host/sys:ro
    - /:/host/root:ro,rslave
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 96m
    logging: *id001
    networks:
    - telemetry
  ingress:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
    - ${MONITORING_PRIVATE_IP:?Set the monitoring EC2 private IP}:9443:443
    volumes:
    - ./ingress.conf:/etc/nginx/conf.d/default.conf:ro
    secrets:
    - tls_certificate
    - tls_key
    - ingestion_map
    depends_on:
    - prometheus
    - loki
    mem_limit: 64m
    logging: *id001
    networks:
    - default
    - telemetry
secrets:
  grafana_password:
    file: ./runtime/monitoring/grafana_password
  tls_certificate:
    file: ./runtime/monitoring/tls.crt
  tls_key:
    file: ./runtime/monitoring/tls.key
  ingestion_map:
    file: ./runtime/monitoring/ingestion.map
networks:
  telemetry:
    internal: true
volumes:
  prometheus_data: null
  grafana_data: null
  loki_data: null
