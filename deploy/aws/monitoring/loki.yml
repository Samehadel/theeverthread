# Single-process Loki. TLS authenticates clients; auth_enabled controls tenancy.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  http_tls_config:
    cert_file: /run/secrets/loki_certificate
    key_file: /run/secrets/loki_key
    client_ca_file: /run/secrets/loki_ca
    client_auth_type: RequireAndVerifyClientCert
  tls_min_version: VersionTLS12

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: '2026-01-01'
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 2
  delete_request_store: filesystem

limits_config:
  retention_period: 72h
  ingestion_rate_mb: 0.05
  ingestion_burst_size_mb: 1
  per_stream_rate_limit: 64KB
  per_stream_rate_limit_burst: 256KB
  max_global_streams_per_user: 1000
  max_query_parallelism: 2
  split_queries_by_interval: 1h
  reject_old_samples: true
  reject_old_samples_max_age: 72h

ingester:
  chunk_idle_period: 5m
  max_chunk_age: 1h
  chunk_target_size: 262144
  wal:
    enabled: true
    dir: /loki/wal
    replay_memory_ceiling: 128MB

querier:
  max_concurrent: 1

query_range:
  cache_results: false

analytics:
  reporting_enabled: false
