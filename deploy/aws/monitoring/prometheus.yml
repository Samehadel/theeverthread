global:
  scrape_interval: 30s
  evaluation_interval: 30s

# Cross-host application targets will be added after mTLS setup.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: monitoring-server
    static_configs:
      - targets: ['monitoring-node:9100']
        labels:
          host: monitoring
  - job_name: blackbox
    static_configs:
      - targets: ['blackbox:9115']
  - job_name: public-uptime
    metrics_path: /probe
    scrape_timeout: 15s
    params:
      module: [https_2xx]
    static_configs:
      - targets: ['https://theeverthread.com/']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
