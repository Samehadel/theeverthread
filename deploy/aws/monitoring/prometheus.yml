global:
  scrape_interval: 30s
  evaluation_interval: 30s

# Cross-host application targets will be added after mTLS setup.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: monitoring-server
    static_configs:
      - targets: ['monitoring-node:9100']
        labels:
          host: monitoring
