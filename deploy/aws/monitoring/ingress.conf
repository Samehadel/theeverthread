# Private HTTPS ingestion only. The token is generated on the monitoring EC2.
map_hash_bucket_size 128;
map $http_authorization $ingest_authorized {
    default 0;
    include /run/secrets/ingestion_map;
}

server {
    listen 443 ssl;
    ssl_certificate /run/secrets/tls_certificate;
    ssl_certificate_key /run/secrets/tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 8m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $prometheus http://prometheus:9090;
    set $loki http://loki:3100;

    if ($ingest_authorized = 0) {
        return 403;
    }

    location = /healthz {
        return 200 'ready\n';
    }
    location = /api/v1/write {
        limit_except POST { deny all; }
        proxy_set_header Authorization "";
        proxy_read_timeout 60s;
        proxy_pass $prometheus$request_uri;
    }
    location = /loki/api/v1/push {
        limit_except POST { deny all; }
        proxy_set_header Authorization "";
        proxy_read_timeout 60s;
        proxy_pass $loki$request_uri;
    }
    location / {
        return 404;
    }
}
