name: theeverthread checks and deployment
on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate monitoring initialization and Compose configuration
        env:
          BACKEND_IMAGE: local/backend
          FRONTEND_IMAGE: local/frontend
          DB_URL: jdbc:postgresql://example/validation
          DB_USER: validation
          DB_PASSWORD: validation-only
        run: |
          python3 -B -m unittest discover -s deploy/aws/monitoring -p 'test_*.py'
          MONITORING_PRIVATE_IP=10.20.0.10 python3 -B deploy/aws/monitoring/init.py monitoring
          install -d -m 700 deploy/aws/monitoring/runtime/app
          install -m 444 deploy/aws/monitoring/runtime/monitoring/ca.crt deploy/aws/monitoring/runtime/app/
          install -m 444 deploy/aws/monitoring/runtime/monitoring/ingestion_token deploy/aws/monitoring/runtime/app/
          MONITORING_PRIVATE_IP=10.20.0.10 python3 -B deploy/aws/monitoring/init.py app
          python3 -m json.tool deploy/aws/monitoring/grafana/dashboards/app.json > /dev/null
          bash -n deploy/aws/deploy.sh deploy/aws/monitoring/manage.sh
          docker compose --env-file deploy/aws/monitoring/runtime/app/host.env \
            -f deploy/aws/compose.yaml -f deploy/aws/monitoring/app.compose.yaml config --quiet
          docker compose --env-file deploy/aws/monitoring/runtime/monitoring/host.env \
            -f deploy/aws/monitoring/compose.yaml config --quiet
      - name: Validate collector and proxy configurations
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/deploy/aws/monitoring/runtime/monitoring:/run/secrets:ro" \
            prom/prometheus:v3.13.5 check config /run/secrets/prometheus.yml
          docker run --rm --env-file deploy/aws/monitoring/runtime/app/host.env \
            -v "$PWD/deploy/aws/monitoring/runtime/app/ca.crt:/run/secrets/monitoring_ca:ro" \
            -v "$PWD/deploy/aws/monitoring/runtime/app/ingestion_token:/run/secrets/ingestion_token:ro" \
            -v "$PWD/deploy/aws/monitoring/runtime/app/prometheus_token:/run/secrets/prometheus_token:ro" \
            -v "$PWD/deploy/aws/monitoring/config.alloy:/etc/alloy/config.alloy:ro" \
            grafana/alloy:v1.21.3 validate /etc/alloy/config.alloy
          docker run --rm \
            -v "$PWD/deploy/aws/monitoring/loki.yaml:/etc/loki/config.yaml:ro" \
            grafana/loki:3.7.9 -config.file=/etc/loki/config.yaml -verify-config=true
          docker run --rm \
            -v "$PWD/deploy/aws/monitoring/blackbox.yaml:/etc/blackbox/config.yaml:ro" \
            prom/blackbox-exporter:v0.27.0 --config.file=/etc/blackbox/config.yaml --config.check
          docker run --rm \
            -v "$PWD/deploy/aws/monitoring/ingress.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/deploy/aws/monitoring/runtime/monitoring/tls.crt:/run/secrets/tls_certificate:ro" \
            -v "$PWD/deploy/aws/monitoring/runtime/monitoring/tls.key:/run/secrets/tls_key:ro" \
            -v "$PWD/deploy/aws/monitoring/runtime/monitoring/ingestion.map:/run/secrets/ingestion_map:ro" \
            nginx:stable-alpine nginx -t
          docker run --rm \
            -v "$PWD/deploy/aws/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:stable-alpine nginx -t
      - name: Verify collector graph starts without network egress
        run: python3 -B deploy/aws/monitoring/check_collector_startup.py

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Backend checks and executable JAR
        working-directory: app/backend
        run: ./gradlew check bootJar --no-daemon
      - name: Preserve backend reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-reports
          path: app/backend/build/reports/
      - name: Preserve tested backend
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: app/backend/build/libs/app.jar
          if-no-files-found: error
          retention-days: 3

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Check application version metadata
        run: |
          node --test scripts/version.test.mjs
          node scripts/version.mjs --check
      - name: Frontend checks and production build
        working-directory: app/frontend
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build
      - name: Preserve tested frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser
          path: app/frontend/dist/frontend/browser/
          if-no-files-found: error
          retention-days: 3

  verify:
    needs: [backend, frontend, monitoring]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Download tested backend
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: app/backend/build/libs
      - name: Install browser test dependencies
        working-directory: app/frontend
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium
      - name: Start local stack and verify browser communication
        working-directory: app
        env:
          # Browser checks do not call AI; satisfy startup validation without a provider secret.
          OPENAI_API_KEY: ci-placeholder-not-a-real-key
        run: |
          cp .env.example .env
          printf '\nDB_PASSWORD=%s\n' "$(openssl rand -hex 24)" >> .env
          docker compose up -d --wait
          set -a
          source .env
          set +a
          java -jar backend/build/libs/app.jar > /tmp/theeverthread-backend.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true; docker compose down -v' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/actuator/health/readiness; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then cat /tmp/theeverthread-backend.log; exit 1; fi
          cd frontend
          npm run test:e2e
      - name: Preserve browser diagnostics
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-reports
          path: |
            app/frontend/test-results/
            /tmp/theeverthread-backend.log

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend: ${{ steps.names.outputs.backend }}@${{ steps.backend.outputs.digest }}
      frontend: ${{ steps.names.outputs.frontend }}@${{ steps.frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: package/backend
      - uses: actions/download-artifact@v4
        with:
          name: frontend-browser
          path: package/frontend/browser
      - name: Prepare image contexts
        run: |
          cp deploy/aws/backend.Dockerfile package/backend/Dockerfile
          cp deploy/aws/frontend.Dockerfile package/frontend/Dockerfile
          cp deploy/aws/nginx.conf package/frontend/nginx.conf
      - name: Choose lowercase image names
        id: names
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          owner="${REPOSITORY_OWNER,,}"
          echo "backend=ghcr.io/${owner}/theeverthread-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${owner}/theeverthread-frontend" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: package/backend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.backend }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Publish frontend
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: package/frontend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.frontend }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    concurrency:
      group: theeverthread-development-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment configuration
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          for key in AWS_REGION AWS_DEPLOY_ROLE_ARN EC2_INSTANCE_ID; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing production environment variable: $key"
              exit 1
            fi
          done
          if [[ ! "$AWS_DEPLOY_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/.+ ]]; then
            echo "::error::AWS_DEPLOY_ROLE_ARN must be an IAM role ARN, not an EC2 instance ARN"
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy and wait for application health
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          BACKEND_IMAGE: ${{ needs.publish.outputs.backend }}
          FRONTEND_IMAGE: ${{ needs.publish.outputs.frontend }}
          AWS_PAGER: ""
        run: python3 deploy/aws/send-deployment.py
